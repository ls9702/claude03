<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff8a3d">
  <title>인생게임</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/lobby.css">
  <link rel="stylesheet" href="/css/game.css">
  <link rel="stylesheet" href="/css/cutin.css">
  <link rel="stylesheet" href="/css/mc.css">
  <link rel="stylesheet" href="/css/cards.css">
  <link rel="stylesheet" href="/css/family.css">
  <link rel="stylesheet" href="/css/stage9.css">
  <!-- Three.js is vendored by `npm install` (scripts/vendor.js → public/vendor/three), no CDN. -->
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }
  </script>
</head>
<body>
  <header class="topbar">
    <h1 class="logo"><span aria-hidden="true">🎲</span> <span class="logo-t">인생게임</span></h1>
    <div class="topbar-right">
      <span id="room-badge" class="badge" hidden></span>
      <span id="spec-badge" class="spec-badge" hidden>👀 관전</span>
      <span id="conn" class="conn" hidden></span>
      <button id="leave-btn" class="btn small ghost" hidden>나가기</button>
    </div>
  </header>

  <main>
    <!-- 1. 입장 -->
    <section id="screen-join" class="screen" hidden>
      <form id="join-form" class="card join-card" novalidate>
        <h2>방 입장</h2>
        <p class="muted">관리자에게 받은 6자리 방 코드와 이름을 입력하세요.</p>
        <label class="field">
          <span>방 코드</span>
          <input name="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="예: AB3DEF" required>
        </label>
        <label class="field">
          <span>내 이름 <span class="name-count" data-name-count aria-live="polite"></span></span>
          <input name="name" maxlength="40" autocomplete="nickname" placeholder="이름 (12자까지)" required>
        </label>
        <p class="form-error" role="alert"></p>
        <div class="join-actions">
          <button class="btn primary block" type="submit" value="player">입장하기</button>
          <button class="btn block" type="submit" value="spectator" data-spectate>👀 관전으로 입장</button>
        </div>
        <p class="muted small join-hint">관전은 캐릭터 없이 말판·컷인·소식만 봐요. 이미 시작한 게임도 들어갈 수 있어요 (TV 화면용).</p>
      </form>
    </section>

    <!-- 2. 로비 -->
    <section id="screen-lobby" class="screen" hidden>
      <div class="lobby-grid">
        <div class="lobby-main">
          <div class="card lobby-info">
            <div>
              <h2>대기실 <span class="code-chip" id="lobby-code"></span></h2>
              <p class="muted" id="lobby-mode"></p>
            </div>
            <p class="muted small">관리자가 게임을 시작하면 자동으로 넘어가요. (캐릭터 2명 이상 필요)</p>
          </div>
          <div class="card">
            <h2>참가자 <span class="count" id="player-count"></span></h2>
            <ul id="player-list" class="player-list"></ul>
          </div>
          <div class="card">
            <h2>캐릭터 <span class="count" id="char-count"></span></h2>
            <div id="char-grid" class="char-grid"></div>
          </div>
          <div class="card">
            <h2>소식</h2>
            <ul id="log-list" class="log-list"></ul>
          </div>
        </div>

        <aside id="my-panel" class="my-panel">
          <button id="sheet-toggle" class="sheet-handle" type="button" aria-expanded="false">
            <span class="grip"></span><span id="sheet-title">내 캐릭터</span><span class="chev">▲</span>
          </button>
          <div class="sheet-body">
            <div id="my-list-wrap">
              <h2 class="desktop-only">내 캐릭터</h2>
              <div id="my-chars" class="my-chars"></div>
              <div class="my-actions">
                <button id="add-char-btn" class="btn primary block" type="button">+ 캐릭터 만들기</button>
                <button id="ready-btn" class="btn block" type="button">준비 완료</button>
              </div>
            </div>
            <div id="customizer-host"></div>
          </div>
        </aside>
      </div>
    </section>

    <!-- 3. 게임 (3D 말판 + 2D 폴백 — public/js/game2d.js, public/js/scene/*) -->
    <section id="screen-game" class="screen" hidden>
      <div id="game-root" class="game"></div>
    </section>

    <!-- 4. 결과 -->
    <section id="screen-result" class="screen" hidden>
      <div class="card result-card">
        <h2>🏆 인생 결산</h2>
        <p class="muted small">총자산(현금 − 빚 + 아이템 되팔기 값 + 집 자산가치 + 보물 감정가 + 특별상 상금) 순위예요.</p>
        <div id="result-root"></div>
        <button id="result-leave" class="btn primary" type="button">다른 방 입장하기</button>
      </div>
    </section>
  </main>

  <div id="reaction-bar" class="reaction-bar" hidden></div>
  <div id="float-layer" class="float-layer" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
